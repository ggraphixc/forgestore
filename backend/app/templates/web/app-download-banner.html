{# Reusable App Download Banner — include on any storefront page #}
{# Usage: {% include "web/app-download-banner.html" %} #}
<style>
  .adb-card {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.75rem 0.75rem 1rem;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 1rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }
  .adb-icon {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 0.625rem;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .adb-icon svg { width: 1.125rem; height: 1.125rem; color: #fff; }
  .adb-title { color: #111827; font-weight: 600; font-size: 0.875rem; line-height: 1.2; }
  .adb-sub { color: #6b7280; font-size: 0.75rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adb-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    padding: 0.5rem 1rem;
    background: #111827;
    color: #fff;
    font-weight: 600;
    font-size: 0.8125rem;
    border-radius: 0.625rem;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .adb-btn:hover { opacity: 0.85; }
  .adb-close {
    flex-shrink: 0;
    padding: 0.375rem;
    background: transparent;
    color: #9ca3af;
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }
  .adb-close:hover { color: #111827; }
  .adb-close svg { width: 1rem; height: 1rem; }

  .dark .adb-card {
    background: rgba(28,25,23,0.85);
    border-color: rgba(255,255,255,0.08);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .dark .adb-icon { background: rgba(255,255,255,0.12); }
  .dark .adb-title { color: #fafaf9; }
  .dark .adb-sub { color: #a8a29e; }
  .dark .adb-btn { background: #fafaf9; color: #111827; }
  .dark .adb-close:hover { color: #fafaf9; }
</style>
<div id="app-download-banner" style="display:none; position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); z-index:45; width:calc(100% - 2rem); max-width:24rem;">
  <div class="adb-card">
    <div class="adb-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" />
      </svg>
    </div>
    <div style="min-width:0; flex:1;">
      <div class="adb-title">Get the app</div>
      <div class="adb-sub">Faster checkout &amp; live tracking</div>
    </div>
    <a href="/shop/download" class="adb-btn">Download</a>
    <button onclick="dismissAppBanner()" class="adb-close" aria-label="Dismiss">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
<script>
(function() {
  // Don't show if user dismissed it or if already in the native app
  try {
    if (localStorage.getItem('app-banner-dismissed')) return;
    if (window.ForgeStore && window.ForgeStore.isCapacitor()) return;
  } catch(e) {}
  // Show after 3 seconds
  setTimeout(function() {
    var b = document.getElementById('app-download-banner');
    if (b) b.style.display = 'block';
  }, 3000);
  // Persist dismiss
  window.dismissAppBanner = function() {
    localStorage.setItem('app-banner-dismissed', '1');
    var b = document.getElementById('app-download-banner');
    if (b) b.style.display = 'none';
  };
})();
</script>
