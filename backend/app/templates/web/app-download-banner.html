{# Reusable App Download Banner — include on any storefront page #}
{# Usage: {% include "web/app-download-banner.html" %} #}
<div id="app-download-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:45; background:linear-gradient(135deg, #d97706, #b45309); padding:0.75rem 1rem; box-shadow:0 -4px 20px rgba(0,0,0,0.15);">
  <div style="max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:0.75rem; min-width:0;">
      <div style="width:2.5rem; height:2.5rem; border-radius:0.75rem; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg style="width:1.25rem; height:1.25rem; color:white;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3" />
        </svg>
      </div>
      <div style="min-width:0;">
        <div style="color:white; font-weight:600; font-size:0.875rem; line-height:1.3;">Get the App</div>
        <div style="color:rgba(255,255,255,0.8); font-size:0.75rem; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Faster checkout, live tracking & app-only deals</div>
      </div>
    </div>
    <div style="display:flex; gap:0.5rem; flex-shrink:0;">
      <a href="/shop/download" style="display:inline-flex; align-items:center; gap:0.375rem; padding:0.5rem 1rem; background:white; color:#b45309; font-weight:600; font-size:0.8125rem; border-radius:0.625rem; text-decoration:none; min-height:36px; transition:opacity 0.2s;">
        Download
      </a>
      <button onclick="document.getElementById('app-download-banner').style.display='none'" style="padding:0.5rem; background:rgba(255,255,255,0.15); color:white; border:none; border-radius:0.5rem; cursor:pointer; min-height:36px; min-width:36px; display:flex; align-items:center; justify-content:center;" aria-label="Dismiss">
        <svg style="width:1rem; height:1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
<script>
(function() {
  // Don't show if user dismissed it or if already in the native app
  try {
    if (localStorage.getItem('app-banner-dismissed')) return;
    if (window.ForgeStore && window.ForgeStore.isCapacitor()) return;
  } catch(e) {}
  // Show after 3 seconds
  setTimeout(function() {
    var b = document.getElementById('app-download-banner');
    if (b) b.style.display = 'block';
  }, 3000);
  // Persist dismiss
  window.dismissAppBanner = function() {
    localStorage.setItem('app-banner-dismissed', '1');
    var b = document.getElementById('app-download-banner');
    if (b) b.style.display = 'none';
  };
})();
</script>
